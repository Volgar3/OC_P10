[tool.poetry]
name = "softdesk"
version = "0.1.0"
description = "API RESTful SoftDesk (OpenClassrooms P10)"
authors = ["Hugo Deles <hugo.deles@sergeferrari.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "6.0.8"
djangorestframework = "3.17.1"
djangorestframework-simplejwt = "5.5.1"
python-dotenv = "^1.2.3"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"
flake8-html = "^0.4.3"
ruff = "^0.15.20"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
